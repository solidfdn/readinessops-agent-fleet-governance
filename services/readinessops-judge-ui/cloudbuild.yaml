steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - services/readinessops-judge-ui/Dockerfile
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

images:
  - ${_IMAGE}

substitutions:
  _IMAGE: asia-northeast1-docker.pkg.dev/readinessops-agent-governance/readinessops/readinessops-judge-ui:latest
